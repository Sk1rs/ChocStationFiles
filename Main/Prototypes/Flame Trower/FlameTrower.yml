- type: entity
  id: BaseFlameBullet
  name: BaseBullet
  description: If you can see this you're probably dead!
  abstract: true
  components:
  - type: Reflective
  - type: FlyBySound
  - type: Clickable
  - type: Sprite
    noRot: false
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: fireball
      shader: unshaded
  - type: Physics
    bodyType: Dynamic
    linearDamping: 0
    angularDamping: 0
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.1,-0.1,0.1,0.1"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
      fly-by: &flybyfixture
        shape: !type:PhysShapeCircle
          radius: 1.5
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: False
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Piercing: 14
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: TimedDespawn
    lifetime: 0.1



- type: entity
  id: BulletFlameTrower
  name: base bullet incendiary
  parent: [BaseFlameBullet]
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Heat: 10
  - type: PointLight
    enabled: true
    color: "#ff4300"
    radius: 2.0
    energy: 7.0
  - type: IgniteOnCollide
    fireStacks: 5



- type: entity
  parent: [Clothing, ClothingSlotBase]
  id: FlameTrowerTank
  name: Огнемётный баллон
  description: Заправляется любой горючей жидкостью, выбрасывает огнесмесь под давлением при помощи сжатого воздуха. Для использования обычно закидывается за спину.
  components:
  - type: Tag
    tags:
    - NozzleBackTank
    - WhitelistChameleon
  - type: Sprite
    sprite: FlameTrowers/FlameTrower.rsi
    state: icon
  - type: Item
    size: Ginormous
  - type: Clothing
    slots: BACK
    sprite: FlameTrowers/FlameTrower.rsi
  - type: Appearance
  - type: SolutionAmmoProvider
    solutionId: WeldingFuel
    proto: BulletFlameTrower
  - type: SolutionContainerManager
    solutions:
      WeldingFuel:
        maxVol: 1000 #much water
  - type: SolutionTransfer
    transferAmount: 50
    maxTransferAmount: 100
    minTransferAmount: 10
    canChangeTransferAmount: true
  - type: UserInterface
    interfaces:
      enum.TransferAmountUiKey.Key:
        type: TransferAmountBoundUserInterface
  - type: DrawableSolution
    solution: WeldingFuel
  - type: RefillableSolution
    solution: WeldingFuel
  - type: DrainableSolution
    solution: WeldingFuel
  - type: ExaminableSolution
    solution: WeldingFuel
    exactVolume: true



- type: entity
  id: FlameTrower
  parent: BaseItem
  name: Огнемётный брандспойт
  description: Поджигает огнесмесь, выбрасываемую под давлением благодаря сжатому кислороду внутри баллона."ФШШШШШШШ ФШШШШШ"
  components:
  - type: Tag
    tags:
    - SprayNozzle
  - type: Sprite
    sprite: FlameTrowers/FlameNozzle.rsi
    state: icon
  - type: Item
    sprite: FlameTrowers/FlameNozzle.rsi
    size: Normal
  - type: Gun
    cameraRecoilScalar: 0 #no recoil
    fireRate: 20
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot: 
      path: /Audio/FlameTrower/FlameTrower.ogg
  - type: Absorbent
    pickupAmount: 35
    solutionName: tank
    useAbsorberSolution: false
    pickupSound:
      path: /Audio/Effects/Fluids/vacuum-cleaner-fast.ogg
  - type: Appearance
  - type: ClothingSlotAmmoProvider
  - type: SlotBasedConnectedContainer
    targetSlot: BACK
    containerWhitelist:
      tags:
      - NozzleBackTank
  - type: UseDelay
    delay: 1.0


