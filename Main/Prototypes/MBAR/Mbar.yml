- type: entity
  name: Browning BAR M1918
  parent: BaseWeaponRifle
  id: WeaponMbar
  description: Browning Automatic Rifle M1918 (MBar 1918) - Ручной пулемёт времён 1-ой мировой войны, заряженный калибром .30-06 Springfield (7.62x51 более новые версии Шведов). Рождён на свет Джоном Браунингом в 1917 году и использован экспедиционным корпусом США в Европе на замену французским ручным  менее удобным пулемётам. Разработан специально для пехоты, идущей на штурм окопов, эффективен для стрельбы от бедра и для стрельбы лёжа.
  components:
  - type: Sprite
    sprite: MBAR/MBAR.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: MBAR/MBARtiny.rsi
  - type: Item
    size: Huge
    shape:
    - 0,0,3,2
    sprite: MBAR/MBARtiny.rsi
  - type: Gun
    minAngle: 2
    maxAngle: 15
    angleIncrease: 1
    angleDecay: 15
    fireRate: 3
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_Sunrise/Weapons/Guns/Rifles/m16a4/m16a4_shot.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineRifleSP
        insertSound: /Audio/_Sunrise/Weapons/Guns/Rifles/AK/ak_reload.ogg
        ejectSound: /Audio/_Sunrise/Weapons/Guns/Rifles/AK/ak_unload.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeRifleSP
        priority: 1
        whitelist:
          tags:
          - CartridgeRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: Wieldable
  - type: UseDelay
    delay: 0.35