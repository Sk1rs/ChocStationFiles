# Polish accent: specific Russian words/phrases are swapped for their exact Polish equivalent (not a
# random pick) so the same word always comes out the same way. Order matters here - longer phrases are
# listed before the shorter words they contain, so e.g. "я работаю" gets replaced as a whole before the
# standalone "я" rule would otherwise eat just the pronoun.
- type: accent
  id: polish
  wordReplacements:
    accent-polish-words-1: accent-polish-words-replace-1
    accent-polish-words-2: accent-polish-words-replace-2
